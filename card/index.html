<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!-- Not linked from the navigation or the footer: this page exists so Ida can type
     idagri.github.io/card on any device and show someone her card. noindex keeps it out of
     search results, which is as hidden as a page on a public site can honestly be.
     If images/business-card.jpg is ever rebuilt, bump the ?v= number so phones reload it. -->
<meta name="robots" content="noindex, follow"/>
<title>Ida Grigoryeva</title>
<style>
:root { --bg:#ffffff; --fg:#1f2229; --muted:#5d6266; --accent:#19756f; --border:#e4e6e8; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#14181c; --fg:#e9e9e9; --muted:#aab0b6; --accent:#4fbdb3; --border:#2a3036; }
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--fg);
  font:16px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
img.card { width:100%; height:auto; display:block;
  border:1px solid var(--border); border-radius:10px; }
ul.contact { list-style:none; margin:22px 0 0; padding:0; }
ul.contact li { margin:0 0 10px; }
ul.contact a { color:var(--accent); text-decoration:none; font-size:1.05rem; }
ul.contact a:hover, ul.contact a:focus { text-decoration:underline; }
p.note { color:var(--muted); font-size:.85rem; margin-top:26px; }
p.note a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <a href="/images/business-card.jpg"><img class="card" src="/images/business-card.jpg?v=1"
       alt="Card for Ida Grigoryeva, PhD Candidate in Economics at UC San Diego, working in development, urban and behavioral economics, with the website idagri.github.io, the email idagri@ucsd.edu, and a QR code that opens the website."></a>
  <ul class="contact">
    <li><a href="https://idagri.github.io/">idagri.github.io</a></li>
    <li><a href="mailto:idagri@ucsd.edu">idagri@ucsd.edu</a></li>
  </ul>
  <p class="note">Turn the phone sideways so the QR is large enough to scan. Tap the card to open
     it full screen, or press and hold it to save a copy.</p>
</main>
</body>
</html>
